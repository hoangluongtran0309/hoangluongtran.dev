# English UI strings. Mirrors i18n/vi.toml key-for-key — every key here
# MUST have a matching key there. See CLAUDE.md §4 invariant #9 (every UI
# string goes through i18n/*.toml, no hardcoded text in templates).
# Wired into templates in Step 3b (separate commit) — this file is data
# only, no call sites reference it yet.

