<footer class="site-footer">
  <div class="container">
    <span class="copyright">{{ .Site.Copyright }}</span>

    <span class="socials">
      {{ with .Site.Params.social.github }}
        <a href="{{ . }}" title="GitHub" rel="me noopener" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.93c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.78 2.72 1.26 3.38.97.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.77.12 3.06.74.8 1.18 1.83 1.18 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
          <span class="visually-hidden">GitHub</span>
        </a>
      {{ end }}
      {{ with .Site.Params.social.linkedin }}
        <a href="{{ . }}" title="LinkedIn" rel="me noopener" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286ZM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065Zm1.782 13.019H3.555V9h3.564v11.452ZM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003Z"/></svg>
          <span class="visually-hidden">LinkedIn</span>
        </a>
      {{ end }}
      {{ with .Site.Params.social.x }}
        <a href="{{ . }}" title="X" rel="me noopener" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.9l-5.4-6.6L4.4 22H1.3l8.1-9.3L1 2h7l4.9 6.1L18.9 2Zm-1.2 18h1.9L7.4 4H5.4l12.3 16Z"/></svg>
          <span class="visually-hidden">X</span>
        </a>
      {{ end }}
      {{/* Luôn trỏ blog feed — xem comment ở baseof.html cạnh <link rel="alternate">. */}}
      <a href="{{ "blog/index.xml" | relLangURL }}" title="RSS">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4a16 16 0 0 1 16 16h-3.2A12.8 12.8 0 0 0 4 7.2V4Zm0 6.4A9.6 9.6 0 0 1 13.6 20h-3.2A6.4 6.4 0 0 0 4 13.6v-3.2ZM6.4 16.8a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6Z"/></svg>
        <span class="visually-hidden">RSS</span>
      </a>
    </span>

    <span class="links">
      <a href="{{ "/tags/" | relLangURL }}">{{ i18n "tags" }}</a>
    </span>
  </div>
</footer>
