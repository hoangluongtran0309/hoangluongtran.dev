{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
  <nav class="paginator">
    {{ if $paginator.HasPrev }}<a href="{{ $paginator.Prev.URL }}">{{ i18n "paginatorNewer" }}</a>{{ end }}
    <span>{{ $paginator.PageNumber }} / {{ $paginator.TotalPages }}</span>
    {{ if $paginator.HasNext }}<a href="{{ $paginator.Next.URL }}">{{ i18n "paginatorOlder" }}</a>{{ end }}
  </nav>
{{ end }}
