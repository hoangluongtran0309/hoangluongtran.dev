<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ItemForge</title>
  <desc id="desc">Một thanh kiếm pixel đang được rèn trên đe, bên cạnh các khối YAML, Java và resource pack.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08130d"/>
      <stop offset="1" stop-color="#183225"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ffe6"/>
      <stop offset="0.5" stop-color="#65d98b"/>
      <stop offset="1" stop-color="#22844a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#86efac" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" rx="24" fill="url(#background)"/>
  <rect width="1200" height="675" rx="24" fill="url(#grid)"/>
  <path d="M0 540 290 388l272 94 236-176 402 172v197H0Z" fill="#0b1e14" opacity=".9"/>

  <g transform="translate(74 84)">
    <text x="0" y="70" fill="#86efac" font-family="Liberation Mono, monospace" font-size="27" letter-spacing="5">OPEN-SOURCE PAPER PLUGIN</text>
    <text x="0" y="156" fill="#f0fff5" font-family="Liberation Sans, sans-serif" font-size="78" font-weight="700">ItemForge</text>
    <text x="2" y="211" fill="#b7c9bd" font-family="Liberation Sans, sans-serif" font-size="28">YAML vào. Custom item ra.</text>
  </g>

  <g transform="translate(815 78)" font-family="Liberation Mono, monospace" font-size="22">
    <rect width="270" height="70" rx="10" fill="#102b1c" stroke="#3ca466"/>
    <text x="28" y="44" fill="#c9f7d8">items.yml</text>
    <rect y="88" width="270" height="70" rx="10" fill="#102b1c" stroke="#3ca466"/>
    <text x="28" y="132" fill="#c9f7d8">Java 21</text>
    <rect y="176" width="270" height="70" rx="10" fill="#102b1c" stroke="#3ca466"/>
    <text x="28" y="220" fill="#c9f7d8">resource-pack.zip</text>
  </g>

  <g transform="translate(415 250)">
    <path d="M66 238h350l58 46-38 52H38L0 284Z" fill="#18231d" stroke="#42634f" stroke-width="8"/>
    <rect x="112" y="330" width="255" height="82" fill="#101814" stroke="#42634f" stroke-width="8"/>
    <rect x="151" y="410" width="176" height="42" fill="#0d120f"/>

    <g transform="translate(78 -16) rotate(15 190 170)" filter="url(#glow)">
      <path d="M190 0h50v222l-25 38-25-38Z" fill="url(#blade)" stroke="#d8ffe6" stroke-width="6"/>
      <rect x="124" y="220" width="182" height="34" fill="#d39b3b" stroke="#ffcf70" stroke-width="6"/>
      <rect x="198" y="251" width="36" height="114" fill="#684525" stroke="#a7793f" stroke-width="6"/>
      <rect x="185" y="354" width="62" height="38" fill="#d39b3b" stroke="#ffcf70" stroke-width="6"/>
    </g>

    <g fill="#f7c85d" filter="url(#glow)">
      <rect x="42" y="150" width="12" height="12"/><rect x="94" y="112" width="9" height="9"/>
      <rect x="390" y="137" width="12" height="12"/><rect x="438" y="190" width="8" height="8"/>
      <rect x="330" y="84" width="9" height="9"/><rect x="35" y="218" width="7" height="7"/>
    </g>
  </g>
</svg>
