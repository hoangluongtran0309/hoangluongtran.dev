<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How a webhook earns trust</title>
  <desc id="desc">A stranger's request passes a size limit, a source lookup by the webhook ID in the path, AES-256-GCM decryption of the secret with tenant-bound authenticated data, and a constant-time HMAC-SHA256 comparison, and only then is the JSON parsed and the tenant taken from the verified source. An oversized body is refused with 413 before any database lookup; every failure from the lookup to the HMAC returns the same 401.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1f"/><stop offset="1" stop-color="#1b1a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a5b4fc"/>
    </marker>
    <marker id="deny" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f5f3ff" font-family="Liberation Sans, sans-serif" font-size="34" font-weight="700">Trust nothing until the signature matches</text>
  <text x="60" y="105" fill="#c4c2dc" font-family="Liberation Sans, sans-serif" font-size="20">POST /webhooks/github/{webhookId} — no cookie, no session, no CSRF token.</text>

  <!-- Untrusted zone -->
  <rect x="40" y="140" width="780" height="330" rx="22" fill="#1f1530" stroke="#f87171" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="172" fill="#fca5a5" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="700" letter-spacing="2">UNTRUSTED</text>

  <g font-family="Liberation Sans, sans-serif" filter="url(#shadow)" text-anchor="middle">
    <rect x="70" y="200" width="170" height="110" rx="16" fill="#1e2250" stroke="#a5b4fc" stroke-width="2"/>
    <text x="155" y="245" fill="#f5f3ff" font-size="20" font-weight="700">1. Size</text>
    <text x="155" y="275" fill="#c7d2fe" font-size="15">before any lookup</text>

    <rect x="265" y="200" width="170" height="110" rx="16" fill="#1e2250" stroke="#a5b4fc" stroke-width="2"/>
    <text x="350" y="245" fill="#f5f3ff" font-size="20" font-weight="700">2. Find source</text>
    <text x="350" y="275" fill="#c7d2fe" font-size="15">UUID from path</text>

    <rect x="460" y="200" width="170" height="110" rx="16" fill="#1e2250" stroke="#a5b4fc" stroke-width="2"/>
    <text x="545" y="245" fill="#f5f3ff" font-size="20" font-weight="700">3. Decrypt</text>
    <text x="545" y="275" fill="#c7d2fe" font-size="15">AES-GCM + AAD</text>

    <rect x="655" y="200" width="145" height="110" rx="16" fill="#1e2250" stroke="#a5b4fc" stroke-width="2"/>
    <text x="727" y="245" fill="#f5f3ff" font-size="20" font-weight="700">4. HMAC</text>
    <text x="727" y="275" fill="#c7d2fe" font-size="15">constant time</text>
  </g>

  <g stroke="#a5b4fc" stroke-width="3" fill="none">
    <path d="M240 255h19" marker-end="url(#arrow)"/>
    <path d="M435 255h19" marker-end="url(#arrow)"/>
    <path d="M630 255h19" marker-end="url(#arrow)"/>
  </g>

  <!-- Deny rail -->
  <g stroke="#f87171" stroke-width="2.5" fill="none" stroke-dasharray="6 6">
    <path d="M155 310v96" marker-end="url(#deny)"/>
    <path d="M350 310v70"/><path d="M545 310v70"/><path d="M727 310v70"/>
    <path d="M350 380h377"/>
    <path d="M538 380v36" marker-end="url(#deny)"/>
  </g>
  <rect x="95" y="420" width="120" height="40" rx="10" fill="#3f1d2b" stroke="#f87171"/>
  <text x="155" y="447" fill="#fecaca" font-family="Liberation Mono, monospace" font-size="18" text-anchor="middle">413</text>
  <rect x="408" y="420" width="260" height="40" rx="10" fill="#3f1d2b" stroke="#f87171"/>
  <text x="538" y="447" fill="#fecaca" font-family="Liberation Mono, monospace" font-size="18" text-anchor="middle">401, one error</text>

  <!-- Trusted zone -->
  <rect x="860" y="140" width="300" height="330" rx="22" fill="#132a24" stroke="#34d399" stroke-width="2"/>
  <text x="882" y="172" fill="#6ee7b7" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="700" letter-spacing="2">VERIFIED</text>
  <g font-family="Liberation Sans, sans-serif" font-size="18" fill="#d1fae5">
    <text x="885" y="222">5. Parse JSON</text>
    <text x="885" y="262">6. Tenant from source,</text>
    <text x="905" y="288">never from payload</text>
    <text x="885" y="328">7. Repository must match</text>
    <text x="885" y="368">8. Record change once</text>
    <text x="885" y="408">9. Record the last</text>
    <text x="905" y="434">verified delivery</text>
  </g>
  <path d="M800 255h54" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- AAD -->
  <g font-family="Liberation Sans, sans-serif">
    <rect x="40" y="510" width="1120" height="150" rx="20" fill="#161a3f" stroke="#6366f1" stroke-width="2"/>
    <text x="64" y="546" fill="#a5b4fc" font-size="17" font-weight="700" letter-spacing="2">ADDITIONAL AUTHENTICATED DATA (AAD) OF THE SECRET</text>
    <g font-family="Liberation Mono, monospace" font-size="17" fill="#e0e7ff" text-anchor="middle">
      <rect x="64" y="566" width="190" height="46" rx="10" fill="#28307a"/><text x="159" y="596">organization</text>
      <rect x="268" y="566" width="150" height="46" rx="10" fill="#28307a"/><text x="343" y="596">project</text>
      <rect x="432" y="566" width="150" height="46" rx="10" fill="#28307a"/><text x="507" y="596">source</text>
      <rect x="596" y="566" width="150" height="46" rx="10" fill="#28307a"/><text x="671" y="596">owner</text>
      <rect x="760" y="566" width="170" height="46" rx="10" fill="#28307a"/><text x="845" y="596">repository</text>
    </g>
    <text x="64" y="640" fill="#c4c2dc" font-size="16">Copy the ciphertext to another source and decryption fails: it is bound to where it belongs.</text>
  </g>
</svg>
