<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Plaintext tồn tại ở đâu</title>
  <desc id="desc">Database metadata chỉ chứa ciphertext. Tầng application dùng key từ biến môi trường ENCRYPTION_SECRET_KEY để giải mã thành một giá trị kết nối tồn tại ngắn. Giá trị đó đi vào tiến trình con qua biến môi trường hoặc file quyền 0600. Giao diện, API, log và argv không bao giờ thấy plaintext.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/><stop offset="1" stop-color="#0f2a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5eead4"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#fcd34d"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f0fdfa" font-family="Liberation Sans, sans-serif" font-size="34" font-weight="700">Một nơi giải mã, những con đường hẹp nhất</text>
  <text x="60" y="105" fill="#a7c4c2" font-family="Liberation Sans, sans-serif" font-size="20">Xanh: chỉ có ciphertext. Vàng: plaintext tồn tại trong thời gian ngắn.</text>

  <g font-family="Liberation Sans, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <!-- metadata db -->
    <rect x="50" y="200" width="250" height="150" rx="18" fill="#0f2f33" stroke="#2dd4bf" stroke-width="2"/>
    <text x="175" y="244" fill="#f0fdfa" font-size="22" font-weight="700">PostgreSQL metadata</text>
    <text x="175" y="280" fill="#a7c4c2" font-family="Liberation Mono, monospace" font-size="15">Base64(IV‖ciphertext‖tag)</text>
    <text x="175" y="312" fill="#a7c4c2" font-size="16">target · storage · channel</text>

    <!-- env key -->
    <rect x="420" y="150" width="300" height="70" rx="14" fill="#0f2f33" stroke="#2dd4bf" stroke-width="2"/>
    <text x="570" y="193" fill="#ccfbf1" font-family="Liberation Mono, monospace" font-size="17">ENCRYPTION_SECRET_KEY</text>

    <!-- application -->
    <rect x="420" y="260" width="300" height="130" rx="18" fill="#2a2410" stroke="#fcd34d" stroke-width="3"/>
    <text x="570" y="302" fill="#fef3c7" font-size="23" font-weight="700">application</text>
    <text x="570" y="334" fill="#fde68a" font-family="Liberation Mono, monospace" font-size="16">EncryptionPort.decrypt</text>
    <text x="570" y="362" fill="#fde68a" font-size="16">nơi duy nhất mở secret</text>

    <!-- child process -->
    <rect x="850" y="200" width="300" height="190" rx="18" fill="#2a2410" stroke="#fcd34d" stroke-width="2"/>
    <text x="1000" y="242" fill="#fef3c7" font-size="22" font-weight="700">tiến trình con</text>
    <text x="1000" y="278" fill="#fde68a" font-family="Liberation Mono, monospace" font-size="15">MYSQL_PWD · PGPASSWORD</text>
    <text x="1000" y="302" fill="#fde68a" font-family="Liberation Mono, monospace" font-size="15">SQLCMDPASSWORD</text>
    <text x="1000" y="336" fill="#fde68a" font-size="16">hoặc file 0600, xóa ngay</text>
    <text x="1000" y="360" fill="#fde68a" font-size="16">khi tiến trình kết thúc</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M302 290h114" stroke="#5eead4" marker-end="url(#arrow)"/>
    <path d="M570 222v34" stroke="#5eead4" marker-end="url(#arrow)"/>
    <path d="M722 320h124" stroke="#fcd34d" marker-end="url(#arrow-amber)"/>
  </g>
  <text x="359" y="278" fill="#a7c4c2" font-family="Liberation Sans, sans-serif" font-size="15" text-anchor="middle">ciphertext</text>
  <text x="784" y="306" fill="#fde68a" font-family="Liberation Sans, sans-serif" font-size="15" text-anchor="middle">qua adapter</text><text x="784" y="346" fill="#fde68a" font-family="Liberation Sans, sans-serif" font-size="15" text-anchor="middle">ngắn hạn</text>

  <!-- never -->
  <g font-family="Liberation Sans, sans-serif">
    <rect x="50" y="450" width="1100" height="140" rx="18" fill="#2a1414" stroke="#fca5a5" stroke-width="2"/>
    <text x="80" y="490" fill="#fecaca" font-size="21" font-weight="700">Không bao giờ thấy plaintext</text>
    <g font-size="18" fill="#fecaca">
      <text x="80" y="530">✗ argv của tiến trình con</text>
      <text x="80" y="562">✗ toString() của giá trị kết nối</text>
      <text x="420" y="530">✗ form chỉnh sửa trong console</text>
      <text x="420" y="562">✗ JSON của /api/v1</text>
      <text x="780" y="530">✗ option dòng lệnh của dbbackup</text>
      <text x="780" y="562">✗ thông báo lỗi gửi đi (đã che)</text>
    </g>
  </g>
</svg>
