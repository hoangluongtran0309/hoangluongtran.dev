<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Luồng dữ liệu của ReleaseFlow</title>
  <desc id="desc">Nguồn GitHub, GitLab, Linear và Jira đi vào change, qua hàng đợi xử lý và phân loại, vào release, sinh note theo audience, rồi outbox automation giao tới các kênh bên ngoài. Tất cả nằm trong một ứng dụng Spring Boot dùng chung PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1f"/><stop offset="1" stop-color="#1b1a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f5f3ff" font-family="Liberation Sans, sans-serif" font-size="34" font-weight="700">ReleaseFlow — một ứng dụng, một luồng</text>
  <text x="60" y="105" fill="#c4c2dc" font-family="Liberation Sans, sans-serif" font-size="20">Package theo năng lực sản phẩm; công việc chạy nền là các bảng hàng đợi trong PostgreSQL.</text>

  <g font-family="Liberation Sans, sans-serif" filter="url(#shadow)">
    <!-- Sources -->
    <rect x="50" y="160" width="190" height="400" rx="20" fill="#141735" stroke="#4f46e5" stroke-width="2"/>
    <text x="145" y="198" fill="#a5b4fc" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">NGUỒN</text>
    <g font-size="19" fill="#e0e7ff" text-anchor="middle">
      <rect x="72" y="222" width="146" height="54" rx="10" fill="#1e2250"/><text x="145" y="256">GitHub</text>
      <rect x="72" y="292" width="146" height="54" rx="10" fill="#1e2250"/><text x="145" y="326">GitLab</text>
      <rect x="72" y="362" width="146" height="54" rx="10" fill="#1e2250"/><text x="145" y="396">Linear</text>
      <rect x="72" y="432" width="146" height="54" rx="10" fill="#1e2250"/><text x="145" y="466">Jira</text>
    </g>
    <text x="145" y="522" fill="#c4c2dc" font-size="15" text-anchor="middle">webhook ký HMAC</text>
    <text x="145" y="542" fill="#c4c2dc" font-size="15" text-anchor="middle">hoặc polling</text>

    <!-- App boundary -->
    <rect x="290" y="140" width="640" height="440" rx="26" fill="#161a3f" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="310" y="172" fill="#a5b4fc" font-size="17" font-weight="700" letter-spacing="2">SPRING BOOT · MỘT JAR</text>

    <g font-size="21" fill="#f5f3ff" text-anchor="middle">
      <rect x="320" y="200" width="170" height="92" rx="16" fill="#28307a" stroke="#a5b4fc" stroke-width="2"/>
      <text x="405" y="240" font-weight="700">change</text>
      <text x="405" y="268" font-size="15" fill="#c7d2fe">ghi nhận một lần</text>

      <rect x="530" y="200" width="170" height="92" rx="16" fill="#28307a" stroke="#a5b4fc" stroke-width="2"/>
      <text x="615" y="240" font-weight="700">processing</text>
      <text x="615" y="268" font-size="15" fill="#c7d2fe">file · rule · AI</text>

      <rect x="740" y="200" width="170" height="92" rx="16" fill="#28307a" stroke="#a5b4fc" stroke-width="2"/>
      <text x="825" y="240" font-weight="700">review</text>
      <text x="825" y="268" font-size="15" fill="#c7d2fe">Change Inbox</text>

      <rect x="740" y="340" width="170" height="92" rx="16" fill="#3b2a7a" stroke="#c4b5fd" stroke-width="2"/>
      <text x="825" y="380" font-weight="700">release</text>
      <text x="825" y="408" font-size="15" fill="#ddd6fe">duyệt · xuất bản</text>

      <rect x="530" y="340" width="170" height="92" rx="16" fill="#3b2a7a" stroke="#c4b5fd" stroke-width="2"/>
      <text x="615" y="380" font-weight="700">audience</text>
      <text x="615" y="408" font-size="15" fill="#ddd6fe">note · ngôn ngữ</text>

      <rect x="320" y="340" width="170" height="92" rx="16" fill="#3b2a7a" stroke="#c4b5fd" stroke-width="2"/>
      <text x="405" y="380" font-weight="700">automation</text>
      <text x="405" y="408" font-size="15" fill="#ddd6fe">outbox · run</text>
    </g>

    <!-- Postgres -->
    <rect x="320" y="470" width="590" height="80" rx="16" fill="#0f1230" stroke="#4f46e5" stroke-width="2"/>
    <text x="615" y="504" fill="#e0e7ff" font-size="20" font-weight="700" text-anchor="middle">PostgreSQL — dữ liệu + hàng đợi</text>
    <text x="615" y="532" fill="#c4c2dc" font-size="15" text-anchor="middle" font-family="Liberation Mono, monospace">FOR UPDATE SKIP LOCKED · trigger bất biến · Flyway V1–V27</text>

    <!-- Destinations -->
    <rect x="980" y="160" width="180" height="400" rx="20" fill="#141735" stroke="#4f46e5" stroke-width="2"/>
    <text x="1070" y="198" fill="#a5b4fc" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">GIAO TỚI</text>
    <g font-size="17" fill="#e0e7ff" text-anchor="middle">
      <text x="1070" y="246">GitHub Release</text>
      <text x="1070" y="284">Slack · Email</text>
      <text x="1070" y="322">Notion</text>
      <text x="1070" y="360">Confluence</text>
      <text x="1070" y="398">Teams</text>
      <text x="1070" y="436">Zendesk</text>
      <text x="1070" y="474">Changelog + RSS</text>
    </g>
  </g>

  <g stroke="#a5b4fc" stroke-width="3" fill="none">
    <path d="M240 246h74" marker-end="url(#arrow)"/>
    <path d="M490 246h34" marker-end="url(#arrow)"/>
    <path d="M700 246h34" marker-end="url(#arrow)"/>
    <path d="M825 292v42" marker-end="url(#arrow)"/>
    <path d="M740 386h-34" marker-end="url(#arrow)"/>
    <path d="M530 386h-34" marker-end="url(#arrow)"/>
    <path d="M405 432q0 20 30 20h530q20 0 20-40V410h8" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
  </g>

  <text x="60" y="640" fill="#c4c2dc" font-family="Liberation Sans, sans-serif" font-size="18">Mỗi mũi tên đi qua một transaction ngắn; mọi lời gọi mạng nằm giữa hai transaction, không bao giờ bên trong.</text>
</svg>
