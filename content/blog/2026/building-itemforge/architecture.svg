<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc ItemForge</title>
  <desc id="desc">Domain ở trung tâm, application và ports bao quanh, ngoài cùng là các adapter YAML, Paper, resource pack, HTTP dashboard và AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09140e"/><stop offset="1" stop-color="#152c20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#72dc96"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f0fff5" font-family="Liberation Sans, sans-serif" font-size="34" font-weight="700">ItemForge — ports &amp; adapters</text>
  <text x="60" y="105" fill="#a9bdb0" font-family="Liberation Sans, sans-serif" font-size="20">Dependency hướng vào trong; chi tiết nền tảng nằm ở biên.</text>

  <g filter="url(#shadow)" font-family="Liberation Sans, sans-serif">
    <rect x="70" y="150" width="1060" height="510" rx="28" fill="#10261a" stroke="#2f744a" stroke-width="2"/>
    <text x="95" y="188" fill="#72dc96" font-size="19" font-weight="700" letter-spacing="2">INFRASTRUCTURE ADAPTERS</text>

    <rect x="245" y="230" width="710" height="360" rx="28" fill="#173824" stroke="#49a96c" stroke-width="2"/>
    <text x="270" y="270" fill="#91e6ac" font-size="19" font-weight="700" letter-spacing="2">APPLICATION + PORTS</text>

    <rect x="410" y="330" width="380" height="170" rx="24" fill="#235b38" stroke="#9af0b5" stroke-width="3"/>
    <text x="600" y="395" fill="#effff4" font-size="30" font-weight="700" text-anchor="middle">DOMAIN</text>
    <text x="600" y="432" fill="#d1f6dc" font-size="19" text-anchor="middle">definitions · registries · balance rules</text>
    <text x="600" y="463" fill="#d1f6dc" font-size="19" text-anchor="middle">không phụ thuộc Paper, YAML hay HTTP</text>

    <g fill="#10261a" stroke="#4cba76" stroke-width="2">
      <rect x="285" y="292" width="180" height="64" rx="10"/><rect x="510" y="270" width="180" height="64" rx="10"/>
      <rect x="735" y="292" width="180" height="64" rx="10"/><rect x="285" y="470" width="180" height="64" rx="10"/>
      <rect x="735" y="470" width="180" height="64" rx="10"/>
    </g>
    <g fill="#e7fff0" font-size="17" text-anchor="middle">
      <text x="375" y="318"><tspan x="375">Config loader</tspan><tspan x="375" dy="22">services</tspan></text>
      <text x="600" y="296"><tspan x="600">Ability dispatch</tspan><tspan x="600" dy="22">+ cooldown</tspan></text>
      <text x="825" y="318"><tspan x="825">ResourcePackPort</tspan><tspan x="825" dy="22">TextureStoragePort</tspan></text>
      <text x="375" y="496"><tspan x="375">Balance analysis</tspan><tspan x="375" dy="22">service</tspan></text>
      <text x="825" y="496"><tspan x="825">AI generator</tspan><tspan x="825" dy="22">ports</tspan></text>
    </g>

    <g fill="#09140e" stroke="#376f4c" stroke-width="2">
      <rect x="105" y="230" width="110" height="82" rx="10"/><rect x="105" y="360" width="110" height="82" rx="10"/>
      <rect x="105" y="490" width="110" height="82" rx="10"/><rect x="985" y="230" width="110" height="82" rx="10"/>
      <rect x="985" y="360" width="110" height="82" rx="10"/><rect x="985" y="490" width="110" height="82" rx="10"/>
    </g>
    <g fill="#bde9ca" font-size="16" text-anchor="middle">
      <text x="160" y="278">YAML</text><text x="160" y="408">Paper API</text><text x="160" y="538">Commands</text>
      <text x="1040" y="266"><tspan x="1040">Resource</tspan><tspan x="1040" dy="20">pack</tspan></text>
      <text x="1040" y="396"><tspan x="1040">Dashboard</tspan><tspan x="1040" dy="20">HTTP API</tspan></text>
      <text x="1040" y="526"><tspan x="1040">AI</tspan><tspan x="1040" dy="20">providers</tspan></text>
    </g>
  </g>

  <g fill="none" stroke="#72dc96" stroke-width="3" marker-end="url(#arrow)" opacity=".9">
    <path d="M215 271H285"/><path d="M215 401H285"/><path d="M215 531H285"/>
    <path d="M985 271H915"/><path d="M985 401H915"/><path d="M985 531H915"/>
  </g>
</svg>
