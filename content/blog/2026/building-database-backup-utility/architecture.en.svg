<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The five Maven modules of Database Backup Utility</title>
  <desc id="desc">core is at the centre and has no dependencies. adapters and application both depend only on core. web is the composition root and depends on both application and adapters. cli is a separate module that talks to web only over HTTP /api/v1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/><stop offset="1" stop-color="#0f2a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5eead4"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#fcd34d"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f0fdfa" font-family="Liberation Sans, sans-serif" font-size="34" font-weight="700">Five modules, one dependency direction</text>
  <text x="60" y="105" fill="#a7c4c2" font-family="Liberation Sans, sans-serif" font-size="20">An arrow means "depends on". Crossing a boundary wrongly is a compile error.</text>

  <g font-family="Liberation Sans, sans-serif" filter="url(#shadow)">
    <!-- web -->
    <rect x="300" y="150" width="440" height="110" rx="18" fill="#123a3f" stroke="#5eead4" stroke-width="2"/>
    <text x="520" y="195" fill="#f0fdfa" font-size="26" font-weight="700" text-anchor="middle">web</text>
    <text x="520" y="228" fill="#a7c4c2" font-size="17" text-anchor="middle">composition root · Thymeleaf · /api/v1 · Quartz</text>

    <!-- adapters -->
    <rect x="160" y="340" width="300" height="110" rx="18" fill="#0f2f33" stroke="#2dd4bf" stroke-width="2"/>
    <text x="310" y="385" fill="#f0fdfa" font-size="26" font-weight="700" text-anchor="middle">adapters</text>
    <text x="310" y="418" fill="#a7c4c2" font-size="16" text-anchor="middle">JPA · Flyway · AES · ProcessRunner</text>

    <!-- application -->
    <rect x="580" y="340" width="300" height="110" rx="18" fill="#0f2f33" stroke="#2dd4bf" stroke-width="2"/>
    <text x="730" y="385" fill="#f0fdfa" font-size="26" font-weight="700" text-anchor="middle">application</text>
    <text x="730" y="418" fill="#a7c4c2" font-size="17" text-anchor="middle">use cases · knows only ports</text>

    <!-- core -->
    <rect x="360" y="530" width="320" height="120" rx="18" fill="#14532d" stroke="#86efac" stroke-width="3"/>
    <text x="520" y="577" fill="#f0fdfa" font-size="28" font-weight="700" text-anchor="middle">core</text>
    <text x="520" y="610" fill="#bbf7d0" font-size="17" text-anchor="middle">domain · ports · no dependencies</text>

    <!-- cli -->
    <rect x="930" y="150" width="210" height="110" rx="18" fill="#2a2410" stroke="#fcd34d" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="1035" y="195" fill="#fef3c7" font-size="26" font-weight="700" text-anchor="middle">cli</text>
    <text x="1035" y="228" fill="#fde68a" font-size="17" text-anchor="middle">JDK HTTP client</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M440 262 330 336" stroke="#5eead4" marker-end="url(#arrow)"/>
    <path d="M600 262 710 336" stroke="#5eead4" marker-end="url(#arrow)"/>
    <path d="M330 452 450 526" stroke="#5eead4" marker-end="url(#arrow)"/>
    <path d="M710 452 590 526" stroke="#5eead4" marker-end="url(#arrow)"/>
    <path d="M928 205H746" stroke="#fcd34d" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
  </g>
  <text x="837" y="192" fill="#fde68a" font-family="Liberation Mono, monospace" font-size="16" text-anchor="middle">HTTP /api/v1</text>

  <g font-family="Liberation Sans, sans-serif" font-size="17" fill="#a7c4c2">
    <text x="900" y="370">✗ application → adapters</text>
    <text x="900" y="400">✗ core → Spring, JPA</text>
    <text x="900" y="430">✗ cli → core, application</text>
    <text x="900" y="480" fill="#5eead4">Use case tests are plain</text>
    <text x="900" y="505" fill="#5eead4">JUnit with mocked ports.</text>
  </g>
</svg>
